version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Must match the windows crate's own windows-core (see Cargo.toml), so it is
      # bumped by hand together with windows rather than on its own.
      - dependency-name: windows-core
    groups:
      egui:
        patterns: ["eframe", "egui*", "epaint*", "emath", "ecolor"]
      everything-else:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
