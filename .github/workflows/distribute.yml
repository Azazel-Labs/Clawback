name: Distribute stable release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published stable tag to distribute (for example v0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
      WINGET_TOKEN:
        required: false

permissions:
  contents: read

# Serialize catalog updates, including manual retries.
concurrency:
  group: distribute-stable
  cancel-in-progress: false

jobs:
  metadata:
    if: github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      enabled: ${{ steps.release.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Inspect published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          DISTRIBUTION_ENABLED: ${{ vars.DISTRIBUTION_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Distribution requires a stable vMAJOR.MINOR.PATCH tag."
            exit 1
          fi
          stable="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)')"
          test "$stable" = true
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          mkdir -p target/distribution
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt --dir target/distribution
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$DISTRIBUTION_ENABLED" == true && "$latest" == "$RELEASE_TAG" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Metadata only: set DISTRIBUTION_ENABLED=true and select the current Latest stable release to submit catalog updates." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Rust
        run: rustup toolchain install
      - name: Generate package metadata
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: cargo xtask distribution "$RELEASE_TAG" target/distribution/SHA256SUMS.txt target/distribution/packages
      - name: Check public download access
        if: steps.release.outputs.enabled == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          for asset in x86_64-pc-windows-msvc.zip aarch64-pc-windows-msvc.zip x86_64-apple-darwin.tar.gz aarch64-apple-darwin.tar.gz; do
            curl --fail --silent --show-error --location --head --retry 3 \
              "https://github.com/Azazel-Labs/Clawback/releases/download/$RELEASE_TAG/clawback-$RELEASE_TAG-$asset" > /dev/null
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-${{ steps.release.outputs.tag }}
          path: target/distribution/packages
          if-no-files-found: error

  homebrew:
    needs: metadata
    if: needs.metadata.outputs.enabled == 'true'
    runs-on: macos-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Require Homebrew credentials
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN with Contents read/write access to Azazel-Labs/homebrew-tap."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Azazel-Labs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-${{ needs.metadata.outputs.tag }}
          path: packages
      - name: Prepare tap commit
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp packages/homebrew/Formula/clawback.rb tap/Formula/clawback.rb
          ruby -c tap/Formula/clawback.rb
          git -C tap config user.name 'github-actions[bot]'
          git -C tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C tap add Formula/clawback.rb
          if ! git -C tap diff --cached --quiet; then
            git -C tap commit -m "Update Clawback to $RELEASE_TAG"
          fi
      - name: Install and test formula before pushing
        run: |
          set -euo pipefail
          brew tap Azazel-Labs/tap "$GITHUB_WORKSPACE/tap"
          brew install Azazel-Labs/tap/clawback
          brew test Azazel-Labs/tap/clawback
      - name: Publish tap update
        run: git -C tap push

  winget:
    needs: metadata
    if: needs.metadata.outputs.enabled == 'true'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require WinGet credentials
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set WINGET_TOKEN for the GitHub account submitting WinGet PRs."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-${{ needs.metadata.outputs.tag }}
          path: packages
      - name: Submit WinGet manifest pull request
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          title="New version: AzazelLabs.Clawback version $version"
          if gh api "repos/microsoft/winget-pkgs/contents/manifests/a/AzazelLabs/Clawback/$version" > /dev/null 2>&1; then
            echo "This version is already in WinGet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing="$(gh pr list --repo microsoft/winget-pkgs --state open --search "\"$title\" in:title" --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            echo "Existing submission: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release download --repo microsoft/winget-create --pattern wingetcreate.exe --dir tools
          ./tools/wingetcreate.exe submit --no-open --prtitle "$title" packages/winget
          echo "WinGet submission sent for review; publication depends on the community repository accepting the PR." >> "$GITHUB_STEP_SUMMARY"
