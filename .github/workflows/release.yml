name: Release

# Nightly builds run on a schedule but only when main has new commits since
# the previous nightly. Version tags publish stable or alpha/beta/RC releases.
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force:
        description: "Build a nightly even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  plan:
    name: Decide whether to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      tag: ${{ steps.decide.outputs.tag }}
      nightly: ${{ steps.decide.outputs.nightly }}
      sha: ${{ steps.decide.outputs.sha }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install toolchain (from rust-toolchain.toml)
        if: startsWith(github.ref, 'refs/tags/v')
        run: rustup toolchain install
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cargo xtask release validate "$RELEASE_TAG"
      - id: decide
        shell: bash
        env:
          FORCE_NIGHTLY: ${{ inputs.force }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "nightly=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run nightly builds from main."
            exit 1
          fi
          echo "tag=nightly" >> "$GITHUB_OUTPUT"
          echo "nightly=true" >> "$GITHUB_OUTPUT"
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
          previous="$(git rev-parse --verify --quiet 'refs/tags/nightly^{commit}' || true)"
          if [[ "$FORCE_NIGHTLY" == "true" ]]; then
            echo "Forced build."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$previous" == "$sha" ]]; then
            echo "No new commits since the last nightly ($previous); skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits since ${previous:-the beginning}; building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Release checks
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: [plan, checks]
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep Linux download builds on a fixed glibc baseline; CI tests ubuntu-latest.
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Install toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="clawback-${{ needs.plan.outputs.tag }}-${{ matrix.target }}"
          cargo xtask package "${{ matrix.target }}" "${{ needs.plan.outputs.tag }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          ls -l dist
      - name: Install Inno Setup 6.7.3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Pyrsys B\.V\.') {
            throw 'Inno Setup download has an unexpected or invalid signature'
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'inno-setup'
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', "/DIR=`"$installDir`"") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          "INNO_COMPILER=$installDir\ISCC.exe" >> $env:GITHUB_ENV
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: ./packaging/windows/build-installer.ps1 -Target $env:RELEASE_TARGET -Tag $env:RELEASE_TAG -Compiler $env:INNO_COMPILER
      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "clawback-$env:RELEASE_TAG-$env:RELEASE_TARGET"
          $setup = (Resolve-Path "dist/$name-setup.exe").Path
          $installDir = Join-Path $env:ProgramFiles 'Clawback'
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          # Exercise both a fresh installation and reinstall/upgrade in place.
          foreach ($attempt in 1..2) {
            $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/TASKS=turbo')
            if ($attempt -eq 1) { $installArgs += "/TurboUser=$sid" }
            $process = Start-Process -FilePath $setup -ArgumentList $installArgs -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "Install attempt $attempt failed: $($process.ExitCode)" }
            $expected = (Get-FileHash "dist/$name/clawback.exe").Hash
            $actual = (Get-FileHash (Join-Path $installDir 'clawback.exe')).Hash
            if ($actual -ne $expected) { throw 'Installed executable differs from portable build' }
            if ((Get-Service ClawbackTurbo).Status -ne 'Running') { throw 'Turbo service did not start' }
            $process = Start-Process -FilePath (Join-Path $installDir 'clawback.exe') -ArgumentList '--turbo-service-check' -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "Turbo broker protocol check failed: $($process.ExitCode)" }
          }
          Restart-Service ClawbackTurbo
          (Get-Service ClawbackTurbo).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          $process = Start-Process -FilePath (Join-Path $installDir 'clawback.exe') -ArgumentList '--turbo-service-check' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Turbo service failed after restart' }
          # A different authorized SID must deny this caller without opening UAC.
          $app = Join-Path $installDir 'clawback.exe'
          $process = Start-Process -FilePath $app -ArgumentList @('--turbo-service-install', 'S-1-5-21-111-222-333-1001') -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Could not configure denied-user test' }
          $process = Start-Process -FilePath $app -ArgumentList '--turbo-service-check' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -eq 0) { throw 'Turbo service accepted an unauthorized user' }
          $process = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Uninstall failed: $($process.ExitCode)" }
          if (Test-Path -LiteralPath (Join-Path $installDir 'clawback.exe')) { throw 'Uninstall left the executable behind' }
          if (Get-Service ClawbackTurbo -ErrorAction SilentlyContinue) { throw 'Uninstall left the service behind' }
      - name: Remove unpacked payload
        shell: bash
        run: rm -rf "dist/clawback-${{ needs.plan.outputs.tag }}-${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clawback-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.plan.outputs.tag }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Replace the previous nightly
        if: needs.plan.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          git tag -f nightly "${{ needs.plan.outputs.sha }}"
          git push -f origin refs/tags/nightly
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: ${{ needs.plan.outputs.nightly == 'true' && format('Nightly {0}', needs.plan.outputs.sha) || needs.plan.outputs.tag }}
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.plan.outputs.prerelease != 'true' }}
          generate_release_notes: ${{ needs.plan.outputs.nightly != 'true' }}
          body: ${{ needs.plan.outputs.nightly == 'true' && 'Automated build of the latest commit on main. Unsigned; see the README for first-run notes on macOS and Windows.' || '' }}
          files: dist/*
          fail_on_unmatched_files: true

  distribute:
    name: Distribute stable release
    needs: [plan, publish]
    if: needs.plan.outputs.prerelease == 'false'
    uses: ./.github/workflows/distribute.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit
