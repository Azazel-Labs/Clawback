name: Auto release

# After CI passes on a push to main, Cargo.toml's [workspace.package] version decides: if no vX.Y.Z tag has it yet,
# that commit is tagged with it, which starts the Release and crates.io workflows; otherwise nothing happens. So the
# version in Cargo.toml is the one source of truth, and raising it (cargo xtask release prepare X.Y.Z) and pushing is
# what releases. Nothing is committed back to main.
#
# The tag is made as whoever pushed the commit that released, not as a bot, so versions show on GitHub as theirs.
# Pushes made with GITHUB_TOKEN don't start workflows, so release.yml and crates.yml are called from here
# rather than started by the tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One at a time, never cancelled mid-push. A newer push's run waits, then sees the newer main.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Plan
        id: plan
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Only act on main's tip: if main has moved on, the newer push's CI run gets here too.
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "main has moved past $SHA; skipping"
            exit 0
          fi
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Cargo.toml's [workspace.package] version, '$version', isn't X.Y.Z"; exit 1
          fi
          # A version behind the newest release is a mistake (pre-releases of the newest X.Y.Z are fine).
          newest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          newest="${newest#v}"; newest="${newest%%-*}"
          if [ -n "$newest" ] && [ "$newest" != "${version%%-*}" ] &&
             [ "$(printf '%s\n%s\n' "$newest" "${version%%-*}" | sort -V | tail -1)" = "$newest" ]; then
            echo "::error::Cargo.toml says $version, behind the newest release, v$newest. Raise it with cargo xtask release prepare."
            exit 1
          fi
          if [[ "$version" == *-* ]] && git rev-parse -q --verify "refs/tags/v${version%%-*}" >/dev/null; then
            echo "::error::Cargo.toml says $version, a pre-release of v${version%%-*}, which is already out."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing v$version"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          # Whoever pushed the commit that released, by their GitHub noreply address, so the version
          # shows as theirs on GitHub without their email in the tag.
          RELEASER: ${{ github.event.workflow_run.actor.login }}
          RELEASER_ID: ${{ github.event.workflow_run.actor.id }}
        run: |
          git config user.name "$RELEASER"
          git config user.email "$RELEASER_ID+$RELEASER@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Clawback $VERSION"
          # Only the tag is pushed. It fails rather than replaces a version tag that's already there.
          git push origin "refs/tags/v$VERSION"

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    permissions: { contents: write, packages: write }
    with:
      tag: v${{ needs.version.outputs.version }}
    secrets: inherit

  crates:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/crates.yml
    permissions: { contents: read }
    with:
      tag: v${{ needs.version.outputs.version }}
    secrets: inherit
