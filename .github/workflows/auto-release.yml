name: Auto release

# After CI passes on a push to main, commit messages drive releases:
#   - #release in any commit since the last version tag tags the next version and starts the Release and crates.io workflows;
#   - #patch, #minor or #major in those commits says how far the version moves (the highest wins;
#     patch when none says).
# A tag counts only on a line by itself or with other tags (e.g. "#minor #release");
# tags mentioned mid-sentence are ignored.
#
# Nothing is committed to main. The version is set in a commit of its own that only the version tag
# points to, so builds from the tag see it in Cargo.toml and there's never a release commit to pull
# first. That commit and the tag are made as whoever pushed the commit that released, not as a bot,
# so versions show on GitHub as theirs. main's Cargo.toml keeps whatever version
# it was last given by hand; the version tags are what count.
#
# Pushes made with GITHUB_TOKEN don't start workflows, so release.yml and crates.yml are called from here
# rather than started by the tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One at a time, never cancelled mid-push. A newer push's run waits, then sees the newer main.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Plan
        id: plan
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Only act on main's tip: if main has moved on, the newer push's CI run gets here too.
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "main has moved past $SHA; skipping"
            exit 0
          fi
          # Tags count only on a line of nothing but tags, so prose that mentions
          # "#major" (like the commit adding this workflow) doesn't bump anything.
          tag_lines() {
            git log --format=%B "$@" | grep -iE '^[[:space:]]*(#(patch|minor|major|release)[[:space:]]*)+$' || true
          }
          # The last version released: the highest version tag, a prerelease sorting before its release.
          # Its commit needn't be on main, so it's found by name, not by walking back from HEAD.
          last="$(git -c versionsort.suffix=- tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          current="${last#v}"
          # No release yet: the first is Cargo.toml's version as it stands.
          [ -n "$current" ] || current="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          lines="$(tag_lines ${last:+"$last"..}HEAD)"
          if ! grep -qiw -- '#release' <<< "$lines"; then
            echo "No #release since ${last:-the start}; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${current%%-*}"
          if [ -z "$last" ]; then version="$current"
          elif grep -qiw -- '#major' <<< "$lines"; then version="$((major + 1)).0.0"
          elif grep -qiw -- '#minor' <<< "$lines"; then version="$major.$((minor + 1)).0"
          elif [[ "$current" == *-* ]]; then version="${current%%-*}"   # 0.9.0-rc.1 -> 0.9.0
          else version="$major.$minor.$((patch + 1))"; fi

          echo "Releasing ${last:-nothing yet} -> v$version"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install toolchain (from rust-toolchain.toml)
        if: steps.plan.outputs.release == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.plan.outputs.release == 'true'
        with:
          key: auto-release
      - name: Tag
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          # Whoever pushed the commit that released, by their GitHub noreply address, so the version
          # shows as theirs on GitHub without their email in the tag.
          RELEASER: ${{ github.event.workflow_run.actor.login }}
          RELEASER_ID: ${{ github.event.workflow_run.actor.id }}
        run: |
          # Setting the version updates the lockfile offline, so download what it resolves against first.
          cargo fetch --locked
          cargo xtask release prepare "$VERSION"
          git config user.name "$RELEASER"
          git config user.email "$RELEASER_ID+$RELEASER@users.noreply.github.com"
          # On a commit only the tag points to; main already having the version needs none.
          git diff --quiet || git commit -qam "Release $VERSION"
          git tag -a "v$VERSION" -m "Clawback $VERSION"
          # Only the tag is pushed. It fails rather than replaces a version tag that's already there.
          git push origin "refs/tags/v$VERSION"

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    permissions: { contents: write, packages: write }
    with:
      tag: v${{ needs.version.outputs.version }}
    secrets: inherit

  crates:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/crates.yml
    permissions: { contents: read }
    with:
      tag: v${{ needs.version.outputs.version }}
    secrets: inherit
