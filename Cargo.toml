[workspace]
members = ["crates/clawback-core", "xtask"]
default-members = [".", "crates/clawback-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT-0"
repository = "https://github.com/Azazel-Labs/Clawback"
authors = ["Azazel Labs"]

[workspace.dependencies]
clawback-core = { path = "crates/clawback-core", version = "0.1.0" }

# ---------------------------------------------------------------------------
# Lints: pedantic clippy with a short, deliberate allow list. CI runs
# `cargo clippy --all-targets -- -D warnings`, so everything here is enforced.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
trivial_numeric_casts = "warn"
redundant_lifetimes = "warn"
missing_unsafe_on_extern = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pixel and byte arithmetic converts between integer and float types
# constantly; these are checked by tests instead.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Style preferences that fight readable UI code.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow" # Settings mirrors a dialog full of checkboxes
items_after_statements = "allow"
# A few restriction lints worth having.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"
rc_mutex = "warn"
str_to_string = "warn"
string_lit_chars_any = "warn"
unnecessary_self_imports = "warn"
verbose_file_reads = "warn"

# ---------------------------------------------------------------------------

[package]
name = "clawback"
description = "Fast, cross-platform disk space visualizer: a Rust homage to SpaceMonger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "clawback"
keywords = ["disk", "treemap", "spacemonger", "disk-usage", "gui"]
categories = ["filesystem", "visualization", "command-line-utilities"]

[features]
screenshots = []
turbo-probe = []
startup-probe = []
perf-probe = []

[dependencies]
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8", features = ["debug-embed"] }
clawback-core.workspace = true
# GUI (wgpu renderer; winit loads X11/Wayland/GL libraries at runtime, so
# there are no system -dev packages to install at build time).
eframe = { version = "0.36", features = ["persistence"] }
# Native folder picker (XDG portal on Linux, pure Rust).
rfd = "0.17"
# Mounted volumes and free space.
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
# Recycle Bin / Trash.
trash = "5.2"
ratatui = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(windows))'.dependencies]
notify = "8.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_WindowsProgramming"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSImage", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSData", "NSDictionary", "NSLocale", "NSArray"] }

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.4.0"
libloading = "0.8"
resvg = { version = "0.48.1", default-features = false }

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Optimise dependencies even in debug builds: egui and the scanner are
# noticeably sluggish otherwise.
[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1.31"
fluent-syntax = "0.12"
unic-langid = "0.9"
