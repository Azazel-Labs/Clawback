translation = "Selaa Linux-tiedostoja"

[messages.wsl-browse-linux-detail]
source = "Open this distribution in Explorer. This may start the distribution."
translation = "Avaa tämä jakelu Resurssienhallinnassa. Tämä saattaa käynnistää jakelun."

[messages.wsl-choose-action]
source = "What would you like to do?"
translation = "Mitä haluat tehdä?"

[messages.wsl-cleanup-help]
source = "Show cleanup guidance"
translation = "Näytä siivousohjeet"

[messages.wsl-compact-admin]
source = "Windows will ask for administrator permission."
translation = "Windows pyytää järjestelmänvalvojan oikeuksia."

[messages.wsl-compact-detail]
source = "Reclaim zero-filled blocks while preserving the disk’s contents. Requires Docker and WSL to be stopped."
translation = "Vapauttaa nollilla täytetyt lohkot ja säilyttää levyn sisällön. Edellyttää, että Docker ja WSL on pysäytetty."

[messages.wsl-compact-ready]
source = "Ready to compact?"
translation = "Tiivistetäänkö levy?"

[messages.wsl-compact-stop-short]
source = "Save your Linux work and quit Docker Desktop. Clawback will stop all WSL sessions, then compact this disk. Keep Docker and WSL closed until it finishes."
translation = "Tallenna työsi Linuxissa ja lopeta Docker Desktop. Clawback pysäyttää kaikki WSL-istunnot ja tiivistää sitten tämän levyn. Pidä Docker ja WSL suljettuina, kunnes tiivistys on valmis."

[messages.wsl-compact-summary]
source = "Recover unused disk space."
translation = "Vapauta käyttämätön levytila."

[messages.wsl-compact-tooltip]
source = "Reclaims zero-filled blocks without deleting your files. Clean up inside Linux or Docker first; savings vary. Docker and WSL must remain stopped during compaction."
translation = "Vapauttaa nollilla täytetyt lohkot poistamatta tiedostojasi. Siivoa ensin Linuxissa tai Dockerissa; säästö vaihtelee. Dockerin ja WSL:n on pysyttävä pysäytettyinä tiivistyksen ajan."

[messages.wsl-copy-command]
source = "Copy command"
translation = "Kopioi komento"

[messages.wsl-disk-details]
source = "File details"
translation = "Tiedoston tiedot"

[messages.wsl-disk-path]
source = "Disk file"
translation = "Levytiedosto"

[messages.wsl-disk-title]
source = "WSL virtual disk"
translation = "WSL-virtuaalilevy"

[messages.wsl-distribution]
source = "WSL distribution"
translation = "WSL-jakelu"

[messages.wsl-docker-cleanup-help]
source = "In Docker Desktop, review images, stopped containers and volumes. Build cache can also be cleaned with “docker builder prune”. Volumes may contain databases or other files you need; inspect them before removing them. Cleanup and disk compaction are separate steps."
translation = "Tarkista Docker Desktopissa kuvat, pysäytetyt kontit ja taltiot. Koontivälimuistin voi myös tyhjentää komennolla ”docker builder prune”. Taltiot voivat sisältää tietokantoja tai muita tarvitsemiasi tiedostoja; tarkista ne ennen poistamista. Siivous ja levyn tiivistäminen ovat erillisiä vaiheita."

[messages.wsl-docker-data-description]
source = "Stores Docker images, containers, volumes and build cache."
translation = "Sisältää Dockerin kuvat, kontit, taltiot ja koontivälimuistin."

[messages.wsl-docker-system-description]
source = "Stores Docker Desktop’s Linux environment. Docker application data may be stored in a separate disk."
translation = "Sisältää Docker Desktopin Linux-ympäristön. Dockerin sovellustiedot voivat olla erillisellä levyllä."

[messages.wsl-linux-cleanup-help]
source = "Browse the distribution’s files and remove data you no longer need. Use its Linux package manager to clean package caches. After cleanup, “sudo fstrim -av” inside the distribution may help release unused blocks before shutting down WSL and compacting."
translation = "Selaa jakelun tiedostoja ja poista tiedot, joita et enää tarvitse. Tyhjennä pakettien välimuistit jakelun Linux-paketinhallinnalla. Siivouksen jälkeen jakelussa suoritettu ”sudo fstrim -av” voi auttaa vapauttamaan käyttämättömiä lohkoja ennen WSL:n sammuttamista ja levyn tiivistämistä."

[messages.wsl-linux-description]
source = "Stores this Linux distribution’s filesystem, including its programs and Linux-side files."
translation = "Sisältää tämän Linux-jakelun tiedostojärjestelmän, mukaan lukien sen ohjelmat ja Linux-puolen tiedostot."

[messages.wsl-open-docker]
source = "Open Docker Desktop"
translation = "Avaa Docker Desktop"

[messages.wsl-open-docker-detail]
source = "Review containers, images and volumes before removing unwanted data."
translation = "Tarkista kontit, kuvat ja taltiot ennen tarpeettomien tietojen poistamista."

[messages.wsl-owner-docker-data]
source = "Docker Desktop — data disk"
translation = "Docker Desktop — tietolevy"

[messages.wsl-owner-docker-system]
source = "Docker Desktop — system disk"
translation = "Docker Desktop — järjestelmälevy"

[messages.wsl-owner-unidentified]
source = "Unidentified Linux distribution"
translation = "Tunnistamaton Linux-jakelu"

[messages.wsl-owner-unidentified-detail]
source = "This path looks like a WSL installation, but no matching registration was found for the current Windows user. The package and file path may help identify it."
translation = "Tämä polku näyttää WSL-asennukselta, mutta nykyiselle Windows-käyttäjälle ei löytynyt vastaavaa rekisteröintiä. Paketti ja tiedostopolku voivat auttaa tunnistamaan sen."

[messages.wsl-package]
source = "Windows package"
translation = "Windows-paketti"

[messages.wsl-prepare-compaction]
source = "Compact disk…"
translation = "Tiivistä levy…"

[messages.wsl-stop-and-compact]
source = "Stop WSL and compact"
translation = "Pysäytä WSL ja tiivistä"

