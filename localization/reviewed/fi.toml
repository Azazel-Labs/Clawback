[messages.reclaim-wsl-body]
source = "Compaction preserves the disk’s contents and reduces its Windows file size by reclaiming blocks filled with zeros. It may reclaim little or no space. Clean up unwanted data inside Docker or Linux first."
translation = "Tiivistäminen säilyttää levyn sisällön ja pienentää sen tiedoston kokoa Windowsissa vapauttamalla nollilla täytettyjä lohkoja. Tilaa voi vapautua vain vähän tai ei lainkaan. Poista ensin tarpeettomat tiedot Dockerista tai Linuxista."

