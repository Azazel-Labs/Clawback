translation = "Tallenna Linux-työsi ja sulje Docker Desktop. Clawback pysäyttää kaikki WSL-istunnot ja tiivistää sitten tämän levyn. Pidä Docker ja WSL suljettuina, kunnes se on valmis."

[messages.wsl-compact-summary]
