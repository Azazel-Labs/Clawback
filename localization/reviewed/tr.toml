source = "This path looks like a WSL installation, but no matching registration was found for the current Windows user. The package and file path may help identify it."
translation = "Bu yol bir WSL kurulumuna benziyor ancak geçerli Windows kullanıcısı için eşleşen kayıt bulunamadı. Paket ve dosya yolu onu tanımlamanıza yardımcı olabilir."

