[messages.reclaim-wsl]
source = "WSL virtual disk; it does not shrink by itself"
translation = "WSL virtuell disk; den krymper ikke av seg selv"

[messages.reclaim-wsl-body]
source = "Compaction preserves the disk’s contents and reduces its Windows file size by reclaiming blocks filled with zeros. It may reclaim little or no space. Clean up unwanted data inside Docker or Linux first."
translation = "Komprimering bevarer diskens innhold og reduserer Windows-filstørrelsen ved å gjenvinne blokker fylt med nuller. Det kan ta tilbake lite eller ingen plass. Rydd opp i uønskede data i Docker eller Linux først."

[messages.reclaim-wsl-space]
source = "Reclaim WSL disk space"
translation = "Gjenvinn WSL-diskplass"

[messages.reclaim-wsl-stop]
source = "Before compacting, save your work, quit Docker Desktop and close WSL sessions. Run this command in PowerShell to stop all WSL distributions. Keep Docker and WSL stopped until compaction finishes. Windows will ask for administrator permission."
translation = "Før du komprimerer, lagre arbeidet ditt, avslutt Docker Desktop og lukk WSL-økter. Kjør denne kommandoen i PowerShell for å stoppe alle WSL-distribusjoner. Hold Docker og WSL stoppet til komprimeringen er ferdig. Windows vil be om administratortillatelse."

