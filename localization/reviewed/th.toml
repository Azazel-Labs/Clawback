translation = "ใน Docker Desktop ให้ตรวจสอบอิมเมจ คอนเทนเนอร์ที่หยุดทำงาน และวอลุ่ม สามารถล้างบิลด์แคชด้วย “docker builder prune” ได้ด้วย วอลุ่มอาจมีฐานข้อมูลหรือไฟล์อื่นที่คุณต้องการ โปรดตรวจสอบก่อนลบ การล้างข้อมูลและการลดขนาดดิสก์เป็นขั้นตอนแยกกัน"

