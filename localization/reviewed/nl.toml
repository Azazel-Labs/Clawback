[messages.wsl-docker-cleanup-help]
source = "In Docker Desktop, review images, stopped containers and volumes. Build cache can also be cleaned with “docker builder prune”. Volumes may contain databases or other files you need; inspect them before removing them. Cleanup and disk compaction are separate steps."
translation = 'Bekijk in Docker Desktop images, gestopte containers en volumes. De build-cache kan ook worden opgeschoond met "docker builder prune". Volumes kunnen databases of andere bestanden bevatten die u nodig heeft; inspecteer ze voordat u ze verwijdert. Opschonen en schijfverdichting zijn afzonderlijke stappen.'

