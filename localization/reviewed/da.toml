translation = "Indeholder Docker Desktops Linux-miljø. Docker-programdata kan ligge på en separat disk."

[messages.wsl-linux-cleanup-help]
source = "Browse the distribution’s files and remove data you no longer need. Use its Linux package manager to clean package caches. After cleanup, “sudo fstrim -av” inside the distribution may help release unused blocks before shutting down WSL and compacting."
translation = "Gennemse distributionens filer, og fjern data, du ikke længere har brug for. Brug distributionens Linux-pakkehåndtering til at rydde pakkecacher. Efter oprydningen kan “sudo fstrim -av” i distributionen hjælpe med at frigive ubrugte blokke, før du lukker WSL ned og komprimerer."

[messages.wsl-linux-description]
source = "Stores this Linux distribution’s filesystem, including its programs and Linux-side files."
translation = "Indeholder denne Linux-distributions filsystem, herunder dens programmer og filer på Linux-siden."

