[messages.reclaim-wsl-body]
source = "Compaction preserves the disk’s contents and reduces its Windows file size by reclaiming blocks filled with zeros. It may reclaim little or no space. Clean up unwanted data inside Docker or Linux first."
translation = "Pemadatan mempertahankan konten disk dan mengurangi ukuran file Windows dengan mengambil kembali blok yang diisi dengan nol. Ini mungkin mendapatkan kembali sedikit atau tidak ada ruang sama sekali. Bersihkan data yang tidak diinginkan di dalam Docker atau Linux terlebih dahulu."

