translation = "Mendapatkan kembali ruang disk WSL"

[messages.reclaim-wsl-stop]
source = "Before compacting, save your work, quit Docker Desktop and close WSL sessions. Run this command in PowerShell to stop all WSL distributions. Keep Docker and WSL stopped until compaction finishes. Windows will ask for administrator permission."
translation = "Sebelum memadatkan, simpan pekerjaan Anda, keluar dari Docker Desktop dan tutup sesi WSL. Jalankan perintah ini di PowerShell untuk menghentikan semua distribusi WSL. Biarkan Docker dan WSL dihentikan hingga pemadatan selesai. Windows akan meminta izin administrator."

