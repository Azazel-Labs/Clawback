translation = "Windows 將請求系統管理員權限。"

[messages.wsl-compact-detail]
source = "Reclaim zero-filled blocks while preserving the disk’s contents. Requires Docker and WSL to be stopped."
translation = "回收零填充區塊，同時保留磁碟內容。需要停止 Docker 和 WSL。"

[messages.wsl-compact-ready]
source = "Ready to compact?"
translation = "準備好壓縮了嗎？"

[messages.wsl-compact-stop-short]
source = "Save your Linux work and quit Docker Desktop. Clawback will stop all WSL sessions, then compact this disk. Keep Docker and WSL closed until it finishes."
translation = "儲存您的 Linux 工作並退出 Docker Desktop。 Clawback 將停止所有 WSL 工作階段，然後壓縮該磁碟。保持 Docker 和 WSL 關閉，直到完成。"

[messages.wsl-compact-summary]
source = "Recover unused disk space."
translation = "恢復未使用的磁碟空間。"

[messages.wsl-compact-tooltip]
source = "Reclaims zero-filled blocks without deleting your files. Clean up inside Linux or Docker first; savings vary. Docker and WSL must remain stopped during compaction."
translation = "回收填滿零的區塊，不會刪除您的檔案。請先清理 Linux 或 Docker 內部不需要的資料；可回收的空間依情況而異。壓縮期間必須保持 Docker 和 WSL 停止。"

[messages.wsl-copy-command]
source = "Copy command"
translation = "複製指令"

[messages.wsl-disk-details]
source = "File details"
translation = "檔案詳細資料"

[messages.wsl-disk-path]
source = "Disk file"
translation = "磁碟檔案"

[messages.wsl-disk-title]
source = "WSL virtual disk"
translation = "WSL 虛擬磁碟"

[messages.wsl-distribution]
source = "WSL distribution"
translation = "WSL 發行版"

[messages.wsl-docker-cleanup-help]
source = "In Docker Desktop, review images, stopped containers and volumes. Build cache can also be cleaned with “docker builder prune”. Volumes may contain databases or other files you need; inspect them before removing them. Cleanup and disk compaction are separate steps."
translation = "在 Docker Desktop 中，檢查映像、已停止的容器和磁碟區。也可以使用「docker builder prune」清理建置快取。磁碟區可能包含資料庫或其他需要的檔案，請在刪除前檢查。清理和壓縮磁碟是兩個獨立步驟。"

[messages.wsl-docker-data-description]
source = "Stores Docker images, containers, volumes and build cache."
translation = "儲存 Docker 映像、容器、磁碟區和建置快取。"

[messages.wsl-docker-system-description]
source = "Stores Docker Desktop’s Linux environment. Docker application data may be stored in a separate disk."
translation = "儲存Docker Desktop的Linux環境。 Docker 應用程式資料可能儲存在單獨的磁碟中。"

[messages.wsl-linux-cleanup-help]
source = "Browse the distribution’s files and remove data you no longer need. Use its Linux package manager to clean package caches. After cleanup, “sudo fstrim -av” inside the distribution may help release unused blocks before shutting down WSL and compacting."
translation = "瀏覽發行版的檔案並刪除不再需要的資料。使用其 Linux 套件管理器來清理套件快取。清理後，發行版內的“sudo fstrim -av”可能有助於在關閉 WSL 和壓縮之前釋放未使用的區塊。"

[messages.wsl-linux-description]
source = "Stores this Linux distribution’s filesystem, including its programs and Linux-side files."
translation = "儲存此 Linux 發行版的檔案系統，包括其程式和 Linux 端檔案。"

[messages.wsl-open-docker]
source = "Open Docker Desktop"
translation = "開啟 Docker Desktop"

[messages.wsl-open-docker-detail]
source = "Review containers, images and volumes before removing unwanted data."
translation = "在刪除不需要的資料之前檢查容器、映像和磁碟區。"

[messages.wsl-owner-docker-data]
source = "Docker Desktop — data disk"
translation = "Docker Desktop — 資料盤"

[messages.wsl-owner-docker-system]
source = "Docker Desktop — system disk"
translation = "Docker Desktop — 系統磁碟"

[messages.wsl-owner-unidentified]
source = "Unidentified Linux distribution"
translation = "未識別的 Linux 發行版本"

[messages.wsl-owner-unidentified-detail]
source = "This path looks like a WSL installation, but no matching registration was found for the current Windows user. The package and file path may help identify it."
translation = "此路徑看起來是 WSL 安裝位置，但找不到目前 Windows 使用者的相符註冊資訊。套件和檔案路徑可能有助於辨識它。"

[messages.wsl-package]
source = "Windows package"
translation = "Windows 套件"

[messages.wsl-prepare-compaction]
source = "Compact disk…"
translation = "壓縮磁碟…"

[messages.wsl-stop-and-compact]
source = "Stop WSL and compact"
translation = "停止 WSL 並壓縮磁碟"

