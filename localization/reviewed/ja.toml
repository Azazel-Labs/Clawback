translation = "圧縮する前に、作業内容を保存し、Docker Desktop を終了して、WSL セッションを閉じます。 PowerShell でこのコマンドを実行して、すべての WSL ディストリビューションを停止します。圧縮が完了するまで、Docker と WSL を停止したままにします。 Windows は管理者の許可を求めます。"

