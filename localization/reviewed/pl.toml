[messages.reclaim-wsl-body]
source = "Compaction preserves the disk’s contents and reduces its Windows file size by reclaiming blocks filled with zeros. It may reclaim little or no space. Clean up unwanted data inside Docker or Linux first."
translation = "Kompaktowanie zachowuje zawartość dysku i zmniejsza rozmiar jego pliku w systemie Windows, odzyskując bloki wypełnione zerami. Może odzyskać niewiele miejsca lub nie odzyskać go wcale. Najpierw usuń niepotrzebne dane w Dockerze lub Linuksie."

[messages.reclaim-wsl-space]
source = "Reclaim WSL disk space"
translation = "Odzyskaj miejsce na dysku WSL"

[messages.reclaim-wsl-stop]
source = "Before compacting, save your work, quit Docker Desktop and close WSL sessions. Run this command in PowerShell to stop all WSL distributions. Keep Docker and WSL stopped until compaction finishes. Windows will ask for administrator permission."
translation = "Przed kompaktowaniem zapisz swoją pracę, zamknij Docker Desktop i zamknij sesje WSL. Uruchom to polecenie w programie PowerShell, aby zatrzymać wszystkie dystrybucje WSL. Zatrzymaj Docker i WSL aż do zakończenia kompaktowania. System Windows poprosi o pozwolenie administratora."

