translation = "Durchsuche die Dateien der Distribution und entferne nicht mehr benötigte Daten. Bereinige Paket-Caches mit ihrem Linux-Paketmanager. Nach der Bereinigung kann „sudo fstrim -av“ innerhalb der Distribution helfen, ungenutzte Blöcke freizugeben, bevor du WSL beendest und den Datenträger komprimierst."

