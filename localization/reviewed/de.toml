translation = "Prüfe in Docker Desktop die Images, gestoppten Container und Volumes. Der Build-Cache lässt sich auch mit „docker builder prune“ bereinigen. Volumes können Datenbanken oder andere benötigte Dateien enthalten; prüfe sie vor dem Entfernen. Bereinigung und Datenträgerkomprimierung sind getrennte Schritte."

