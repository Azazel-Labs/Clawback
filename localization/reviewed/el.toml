translation = "Εικονικός δίσκος WSL"

[messages.wsl-distribution]
source = "WSL distribution"
translation = "Διανομή WSL"

[messages.wsl-docker-cleanup-help]
source = "In Docker Desktop, review images, stopped containers and volumes. Build cache can also be cleaned with “docker builder prune”. Volumes may contain databases or other files you need; inspect them before removing them. Cleanup and disk compaction are separate steps."
translation = 'Στο Docker Desktop, ελέγξτε τις εικόνες, τα σταματημένα κοντέινερ και τους τόμους. Η κρυφή μνήμη κατασκευής μπορεί επίσης να καθαριστεί με το "docker builder prune". Οι τόμοι μπορεί να περιέχουν βάσεις δεδομένων ή άλλα αρχεία που χρειάζεστε· ελέγξτε τους πριν τους αφαιρέσετε. Ο καθαρισμός και η συμπύκνωση του δίσκου είναι ξεχωριστά βήματα.'

[messages.wsl-docker-data-description]
source = "Stores Docker images, containers, volumes and build cache."
translation = "Αποθηκεύει εικόνες Docker, κοντέινερ, τόμους και την κρυφή μνήμη κατασκευής."

[messages.wsl-docker-system-description]
source = "Stores Docker Desktop’s Linux environment. Docker application data may be stored in a separate disk."
translation = "Αποθηκεύει το περιβάλλον Linux του Docker Desktop. Τα δεδομένα της εφαρμογής Docker μπορούν να αποθηκευτούν σε ξεχωριστό δίσκο."

[messages.wsl-linux-cleanup-help]
source = "Browse the distribution’s files and remove data you no longer need. Use its Linux package manager to clean package caches. After cleanup, “sudo fstrim -av” inside the distribution may help release unused blocks before shutting down WSL and compacting."
translation = 'Περιηγηθείτε στα αρχεία της διανομής και αφαιρέστε δεδομένα που δεν χρειάζεστε πλέον. Χρησιμοποιήστε τον διαχειριστή πακέτων της διανομής για να καθαρίσετε τις κρυφές μνήμες πακέτων. Μετά την εκκαθάριση, η εκτέλεση του "sudo fstrim -av" μέσα στη διανομή μπορεί να βοηθήσει στην απελευθέρωση αχρησιμοποίητων μπλοκ πριν από τον τερματισμό του WSL και τη συμπύκνωση του δίσκου.'

[messages.wsl-linux-description]
source = "Stores this Linux distribution’s filesystem, including its programs and Linux-side files."
translation = "Αποθηκεύει το σύστημα αρχείων αυτής της διανομής Linux, συμπεριλαμβανομένων των προγραμμάτων και των αρχείων του Linux."

