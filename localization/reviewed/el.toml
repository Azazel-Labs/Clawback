translation = "Άνοιγμα του Docker Desktop"

[messages.wsl-open-docker-detail]
source = "Review containers, images and volumes before removing unwanted data."
translation = "Ελέγξτε τα κοντέινερ, τις εικόνες και τους τόμους πριν αφαιρέσετε ανεπιθύμητα δεδομένα."

