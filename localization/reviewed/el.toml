[messages.reclaim-wsl-body]
source = "Compaction preserves the disk’s contents and reduces its Windows file size by reclaiming blocks filled with zeros. It may reclaim little or no space. Clean up unwanted data inside Docker or Linux first."
translation = "Η συμπύκνωση διατηρεί τα περιεχόμενα του δίσκου και μειώνει το μέγεθος του αρχείου του στα Windows ανακτώντας μπλοκ γεμάτα μηδενικά. Μπορεί να ανακτήσει λίγο ή καθόλου χώρο. Καθαρίστε πρώτα τα ανεπιθύμητα δεδομένα μέσα στο Docker ή το Linux."

[messages.reclaim-wsl-space]
source = "Reclaim WSL disk space"
translation = "Ανάκτηση χώρου στο δίσκο WSL"

[messages.reclaim-wsl-stop]
source = "Before compacting, save your work, quit Docker Desktop and close WSL sessions. Run this command in PowerShell to stop all WSL distributions. Keep Docker and WSL stopped until compaction finishes. Windows will ask for administrator permission."
translation = "Πριν από τη συμπύκνωση, αποθηκεύστε την εργασία σας, κλείστε το Docker Desktop και κλείστε τις συνεδρίες WSL. Εκτελέστε αυτήν την εντολή στο PowerShell για να σταματήσετε όλες τις διανομές WSL. Διατηρήστε το Docker και το WSL σταματημένα μέχρι να ολοκληρωθεί η συμπύκνωση. Τα Windows θα ζητήσουν άδεια διαχειριστή."

