[messages.wsl-compact-admin]
source = "Windows will ask for administrator permission."
translation = "Τα Windows θα ζητήσουν άδεια διαχειριστή."

[messages.wsl-compact-detail]
source = "Reclaim zero-filled blocks while preserving the disk’s contents. Requires Docker and WSL to be stopped."
translation = "Ανακτά μπλοκ γεμάτα μηδενικά διατηρώντας τα περιεχόμενα του δίσκου. Απαιτεί να έχουν σταματήσει το Docker και το WSL."

[messages.wsl-compact-ready]
source = "Ready to compact?"
translation = "Έτοιμοι για συμπύκνωση;"

[messages.wsl-compact-stop-short]
source = "Save your Linux work and quit Docker Desktop. Clawback will stop all WSL sessions, then compact this disk. Keep Docker and WSL closed until it finishes."
translation = "Αποθηκεύστε την εργασία σας στο Linux και κλείστε το Docker Desktop. Το Clawback θα σταματήσει όλες τις συνεδρίες WSL και μετά θα συμπυκνώσει αυτόν τον δίσκο. Κρατήστε το Docker και το WSL κλειστά μέχρι να ολοκληρωθεί η διαδικασία."

[messages.wsl-compact-summary]
source = "Recover unused disk space."
translation = "Ανάκτηση αχρησιμοποίητου χώρου στο δίσκο."

[messages.wsl-compact-tooltip]
source = "Reclaims zero-filled blocks without deleting your files. Clean up inside Linux or Docker first; savings vary. Docker and WSL must remain stopped during compaction."
translation = "Ανακτά μπλοκ γεμάτα μηδενικά χωρίς να διαγράφει τα αρχεία σας. Καθαρίστε πρώτα τα δεδομένα μέσα στο Linux ή το Docker· ο χώρος που ανακτάται ποικίλλει. Το Docker και το WSL πρέπει να παραμείνουν σταματημένα κατά τη συμπύκνωση."

