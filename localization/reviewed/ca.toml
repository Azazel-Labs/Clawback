[messages.wsl-docker-cleanup-help]
source = "In Docker Desktop, review images, stopped containers and volumes. Build cache can also be cleaned with “docker builder prune”. Volumes may contain databases or other files you need; inspect them before removing them. Cleanup and disk compaction are separate steps."
translation = 'A Docker Desktop, reviseu imatges, contenidors aturats i volums. La memòria cau de compilació també es pot netejar amb "docker builder prune". Els volums poden contenir bases de dades o altres fitxers que necessiteu; inspeccioneu-los abans de retirar-los. La neteja i la compactació del disc són passos separats.'

[messages.wsl-docker-data-description]
source = "Stores Docker images, containers, volumes and build cache."
translation = "Emmagatzema imatges de Docker, contenidors, volums i memòria cau de creació."

[messages.wsl-docker-system-description]
source = "Stores Docker Desktop’s Linux environment. Docker application data may be stored in a separate disk."
translation = "Emmagatzema l'entorn Linux de Docker Desktop. Les dades de l'aplicació Docker es poden emmagatzemar en un disc independent."

[messages.wsl-linux-cleanup-help]
source = "Browse the distribution’s files and remove data you no longer need. Use its Linux package manager to clean package caches. After cleanup, “sudo fstrim -av” inside the distribution may help release unused blocks before shutting down WSL and compacting."
translation = """Examineu els fitxers de la distribució i elimineu les dades que ja no necessiteu. Utilitzeu el seu gestor de paquets Linux per netejar la memòria cau de paquets. Després de la neteja, "sudo fstrim -av" dins de la distribució pot ajudar a alliberar blocs no utilitzats abans d'apagar WSL i compactar."""

[messages.wsl-linux-description]
source = "Stores this Linux distribution’s filesystem, including its programs and Linux-side files."
translation = "Emmagatzema el sistema de fitxers d'aquesta distribució de Linux, inclosos els seus programes i fitxers del costat de Linux."

