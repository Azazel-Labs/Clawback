[messages.wsl-compact-stop-short]
source = "Save your Linux work and quit Docker Desktop. Clawback will stop all WSL sessions, then compact this disk. Keep Docker and WSL closed until it finishes."
translation = "Linux 작업을 저장하고 Docker Desktop을 종료하십시오. Clawback은 모든 WSL 세션을 중지한 다음 이 디스크를 압축합니다. 완료될 때까지 Docker와 WSL을 닫아 두세요."

[messages.wsl-compact-summary]
source = "Recover unused disk space."
translation = "사용되지 않은 디스크 공간을 복구합니다."

[messages.wsl-compact-tooltip]
source = "Reclaims zero-filled blocks without deleting your files. Clean up inside Linux or Docker first; savings vary. Docker and WSL must remain stopped during compaction."
translation = "파일을 삭제하지 않고 0으로 채워진 블록을 회수합니다. 먼저 Linux 또는 Docker 내부의 불필요한 데이터를 정리하세요. 확보되는 공간은 상황에 따라 다릅니다. 압축 중에는 Docker와 WSL을 중지한 상태로 유지해야 합니다."

[messages.wsl-copy-command]
source = "Copy command"
translation = "명령 복사"

[messages.wsl-disk-details]
source = "File details"
translation = "파일 세부정보"

[messages.wsl-disk-path]
source = "Disk file"
translation = "디스크 파일"

[messages.wsl-disk-title]
source = "WSL virtual disk"
translation = "WSL 가상 디스크"

[messages.wsl-distribution]
source = "WSL distribution"
translation = "WSL 배포판"

[messages.wsl-docker-cleanup-help]
source = "In Docker Desktop, review images, stopped containers and volumes. Build cache can also be cleaned with “docker builder prune”. Volumes may contain databases or other files you need; inspect them before removing them. Cleanup and disk compaction are separate steps."
translation = 'Docker Desktop에서 이미지, 중지된 컨테이너 및 볼륨을 검토합니다. 빌드 캐시는 "docker builder prune"을 사용하여 정리할 수도 있습니다. 볼륨에는 필요한 데이터베이스나 기타 파일이 포함될 수 있습니다. 제거하기 전에 검사하십시오. 정리와 디스크 압축은 별도의 단계입니다.'

[messages.wsl-docker-data-description]
source = "Stores Docker images, containers, volumes and build cache."
translation = "Docker 이미지, 컨테이너, 볼륨 및 빌드 캐시를 저장합니다."

[messages.wsl-docker-system-description]
source = "Stores Docker Desktop’s Linux environment. Docker application data may be stored in a separate disk."
translation = "Docker Desktop의 Linux 환경을 저장합니다. Docker 애플리케이션 데이터는 별도의 디스크에 저장될 수 있습니다."

[messages.wsl-linux-cleanup-help]
source = "Browse the distribution’s files and remove data you no longer need. Use its Linux package manager to clean package caches. After cleanup, “sudo fstrim -av” inside the distribution may help release unused blocks before shutting down WSL and compacting."
translation = '배포 파일을 찾아보고 더 이상 필요하지 않은 데이터를 제거하세요. Linux 패키지 관리자를 사용하여 패키지 캐시를 정리합니다. 정리 후 배포판 내부의 "sudo fstrim -av"는 WSL을 종료하고 압축하기 전에 사용되지 않은 블록을 해제하는 데 도움이 될 수 있습니다.'

[messages.wsl-linux-description]
source = "Stores this Linux distribution’s filesystem, including its programs and Linux-side files."
translation = "프로그램 및 Linux 측 파일을 포함하여 이 Linux 배포판의 파일 시스템을 저장합니다."

