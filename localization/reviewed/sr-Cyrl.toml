[messages.wsl-distribution]
source = "WSL distribution"
translation = "WSL дистрибуција"

[messages.wsl-docker-cleanup-help]
source = "In Docker Desktop, review images, stopped containers and volumes. Build cache can also be cleaned with “docker builder prune”. Volumes may contain databases or other files you need; inspect them before removing them. Cleanup and disk compaction are separate steps."
translation = "У Docker Desktop-у прегледајте слике, заустављене контејнере и волумене. Кеш за изградњу може се очистити и командом „docker builder prune“. Волумени могу садржати базе података или друге потребне датотеке; проверите их пре уклањања. Чишћење и сажимање диска су одвојени кораци."

[messages.wsl-docker-data-description]
source = "Stores Docker images, containers, volumes and build cache."
translation = "Чува Docker слике, контејнере, волумене и кеш за изградњу."

[messages.wsl-docker-system-description]
source = "Stores Docker Desktop’s Linux environment. Docker application data may be stored in a separate disk."
translation = "Чува Линук окружење Docker Desktop-а. Подаци апликације Docker могу се чувати на посебном диску."

[messages.wsl-linux-cleanup-help]
source = "Browse the distribution’s files and remove data you no longer need. Use its Linux package manager to clean package caches. After cleanup, “sudo fstrim -av” inside the distribution may help release unused blocks before shutting down WSL and compacting."
translation = "Прегледајте датотеке дистрибуције и уклоните непотребне податке. Користите њен Linux управљач пакетима за чишћење кеша пакета. После чишћења, команда „sudo fstrim -av“ унутар дистрибуције може ослободити неискоришћене блокове пре гашења WSL-а и сажимања диска."

[messages.wsl-linux-description]
source = "Stores this Linux distribution’s filesystem, including its programs and Linux-side files."
translation = "Чува систем датотека ове дистрибуције Линука, укључујући њене програме и датотеке на страни Линука."

[messages.wsl-open-docker]
source = "Open Docker Desktop"
translation = "Отворите Docker Desktop"

[messages.wsl-open-docker-detail]
source = "Review containers, images and volumes before removing unwanted data."
translation = "Прегледајте контејнере, слике и волумене пре уклањања нежељених података."

