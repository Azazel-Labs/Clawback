translation = "Ова локација припада инсталираном софтверу. Изаберите апликацију у наставку да бисте деинсталирали целу апликацију, укључујући датотеке изван изабране фасцикле. Виндовс или Steam ће обавити уклањање."

[messages.uninstaller-launch-error]
source = "Windows could not start the uninstaller (error { $code }). Open Installed Apps to manage this application."
translation = "Виндовс није могао да покрене деинсталатор (грешка { $code }). Отворите инсталиране апликације да бисте управљали овом апликацијом."

[messages.uninstaller-missing]
source = "The registered uninstaller could not be found. Open Windows Installed Apps to manage this application."
translation = "Није могуће пронаћи регистровани програм за деинсталацију. Отворите Виндовс инсталиране апликације да бисте управљали овом апликацијом."

