[messages.wsl-compact-admin]
source = "Windows will ask for administrator permission."
translation = "Виндовс ће тражити дозволу администратора."

[messages.wsl-compact-detail]
source = "Reclaim zero-filled blocks while preserving the disk’s contents. Requires Docker and WSL to be stopped."
translation = "Повратите блокове попуњене нулом уз очување садржаја диска. Захтева да Docker и WSL буду заустављени."

[messages.wsl-compact-ready]
source = "Ready to compact?"
translation = "Спремни за сажимање?"

[messages.wsl-compact-stop-short]
source = "Save your Linux work and quit Docker Desktop. Clawback will stop all WSL sessions, then compact this disk. Keep Docker and WSL closed until it finishes."
translation = "Сачувајте свој рад у Linux-у и затворите Docker Desktop. Clawback ће зауставити све WSL сесије, а затим сажети овај диск. Не покрећите Docker и WSL док се поступак не заврши."

[messages.wsl-compact-summary]
source = "Recover unused disk space."
translation = "Повратите неискоришћени простор на диску."

[messages.wsl-compact-tooltip]
source = "Reclaims zero-filled blocks without deleting your files. Clean up inside Linux or Docker first; savings vary. Docker and WSL must remain stopped during compaction."
translation = "Ослобађа блокове испуњене нулама без брисања ваших датотека. Прво очистите непотребне податке у Linux-у или Docker-у; количина ослобођеног простора варира. Docker и WSL морају остати заустављени током сажимања."

