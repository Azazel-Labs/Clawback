translation = "Mentse el linuxos munkáját, és lépjen ki a Docker Desktopból. A Clawback leállítja az összes WSL-munkamenetet, majd tömöríti ezt a lemezt. Tartsa zárva a Dockert és a WSL-t, amíg be nem fejeződik."

[messages.wsl-compact-summary]
source = "Recover unused disk space."
translation = "A fel nem használt lemezterület helyreállítása."

[messages.wsl-compact-tooltip]
source = "Reclaims zero-filled blocks without deleting your files. Clean up inside Linux or Docker first; savings vary. Docker and WSL must remain stopped during compaction."
translation = "Visszanyeri a nullával töltött blokkokat a fájlok törlése nélkül. Először tisztítsa meg a Linuxot vagy a Dockert; a megtakarítások változóak. A Dockernek és a WSL-nek leállított állapotban kell maradnia a tömörítés alatt."

