[messages.wsl-compact-tooltip]
source = "Reclaims zero-filled blocks without deleting your files. Clean up inside Linux or Docker first; savings vary. Docker and WSL must remain stopped during compaction."
translation = "Thu hồi các khối chứa toàn số không mà không xóa tệp của bạn. Trước tiên hãy dọn dữ liệu không cần thiết bên trong Linux hoặc Docker; dung lượng thu hồi được có thể khác nhau. Docker và WSL phải được giữ ở trạng thái dừng trong suốt quá trình thu gọn."

