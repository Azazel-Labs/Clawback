[messages.wsl-docker-cleanup-help]
source = "In Docker Desktop, review images, stopped containers and volumes. Build cache can also be cleaned with “docker builder prune”. Volumes may contain databases or other files you need; inspect them before removing them. Cleanup and disk compaction are separate steps."
translation = "No Docker Desktop, reveja as imagens, os contentores parados e os volumes. A cache de compilação também pode ser limpa com “docker builder prune”. Os volumes podem conter bases de dados ou outros ficheiros necessários; inspecione-os antes de os remover. A limpeza e a compactação do disco são etapas separadas."

[messages.wsl-docker-data-description]
source = "Stores Docker images, containers, volumes and build cache."
translation = "Armazena imagens, contentores, volumes e a cache de compilação do Docker."

[messages.wsl-docker-system-description]
source = "Stores Docker Desktop’s Linux environment. Docker application data may be stored in a separate disk."
translation = "Armazena o ambiente Linux do Docker Desktop. Os dados das aplicações Docker podem estar num disco separado."

[messages.wsl-linux-cleanup-help]
source = "Browse the distribution’s files and remove data you no longer need. Use its Linux package manager to clean package caches. After cleanup, “sudo fstrim -av” inside the distribution may help release unused blocks before shutting down WSL and compacting."
translation = "Explore os ficheiros da distribuição e remova os dados de que já não precisa. Use o gestor de pacotes Linux para limpar as caches de pacotes. Após a limpeza, executar “sudo fstrim -av” dentro da distribuição pode ajudar a libertar blocos não utilizados antes de desligar o WSL e compactar."

[messages.wsl-linux-description]
source = "Stores this Linux distribution’s filesystem, including its programs and Linux-side files."
translation = "Armazena o sistema de ficheiros desta distribuição Linux, incluindo seus programas e ficheiros do lado do Linux."

