[messages.permission-hint-macos]
source = 'macOS protects some folders (Mail, Messages, other users, …). Grant Clawback "Full Disk Access" in System Settings › Privacy & Security to include them.'
translation = "macOS захищає деякі теки (Пошта, Повідомлення, теки інших користувачів тощо). Щоб включити їх до сканування, надайте Clawback повний доступ до диска в розділі «Системні параметри» › «Приватність і безпека»."

[messages.permission-hint-unix]
source = "Some folders are only readable by other users or root. Run Clawback with elevated privileges (for example `sudo -E clawback /`) to include them."
translation = "Деякі теки можуть читати лише інші користувачі або root. Щоб включити їх до сканування, запустіть Clawback із підвищеними правами (наприклад, `sudo -E clawback /`)."

[messages.permission-hint-windows]
source = "Some system folders are only readable by administrators. Run Clawback as administrator to include them."
translation = "Деякі системні теки можуть читати лише адміністратори. Щоб включити їх до сканування, запустіть Clawback від імені адміністратора."

