translation = "Зберігає середовище Linux Docker Desktop. Дані програми Docker можуть зберігатися на окремому диску."

[messages.wsl-linux-cleanup-help]
source = "Browse the distribution’s files and remove data you no longer need. Use its Linux package manager to clean package caches. After cleanup, “sudo fstrim -av” inside the distribution may help release unused blocks before shutting down WSL and compacting."
translation = "Перегляньте файли дистрибутива та видаліть дані, які вам більше не потрібні. Використовуйте його менеджер пакетів Linux, щоб очистити кеш пакетів. Після очищення «sudo fstrim -av» у дистрибутиві може допомогти звільнити невикористані блоки перед вимкненням WSL і стисненням."

[messages.wsl-linux-description]
source = "Stores this Linux distribution’s filesystem, including its programs and Linux-side files."
translation = "Зберігає файлову систему цього дистрибутива Linux, включаючи його програми та файли на стороні Linux."

