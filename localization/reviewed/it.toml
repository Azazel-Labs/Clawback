source = "WSL virtual disk; it does not shrink by itself"
translation = "Disco virtuale WSL; non si riduce da solo"

[messages.reclaim-wsl-body]
source = "Compaction preserves the disk’s contents and reduces its Windows file size by reclaiming blocks filled with zeros. It may reclaim little or no space. Clean up unwanted data inside Docker or Linux first."
translation = "La compattazione preserva il contenuto del disco e riduce le dimensioni del file Windows recuperando i blocchi riempiti con zeri. Potrebbe recuperare poco o nessuno spazio. Pulisci prima i dati indesiderati all'interno di Docker o Linux."

