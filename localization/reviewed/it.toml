translation = "Recuperare spazio su disco WSL"

[messages.reclaim-wsl-stop]
source = "Before compacting, save your work, quit Docker Desktop and close WSL sessions. Run this command in PowerShell to stop all WSL distributions. Keep Docker and WSL stopped until compaction finishes. Windows will ask for administrator permission."
translation = "Prima della compattazione, salva il lavoro, esci da Docker Desktop e chiudi le sessioni WSL. Esegui questo comando in PowerShell per interrompere tutte le distribuzioni WSL. Mantieni Docker e WSL interrotti fino al termine della compattazione. Windows chiederà l'autorizzazione di amministratore."

