[messages.wsl-docker-cleanup-help]
source = "In Docker Desktop, review images, stopped containers and volumes. Build cache can also be cleaned with “docker builder prune”. Volumes may contain databases or other files you need; inspect them before removing them. Cleanup and disk compaction are separate steps."
translation = "Dans Docker Desktop, examinez les images, conteneurs arrêtés et volumes. Le cache de compilation peut aussi être nettoyé avec « docker builder prune ». Les volumes peuvent contenir des bases de données ou d'autres fichiers utiles ; inspectez-les avant de les supprimer. Le nettoyage et le compactage du disque sont deux étapes distinctes."

[messages.wsl-docker-data-description]
source = "Stores Docker images, containers, volumes and build cache."
translation = "Stocke les images, conteneurs, volumes et le cache de compilation Docker."

[messages.wsl-docker-system-description]
source = "Stores Docker Desktop’s Linux environment. Docker application data may be stored in a separate disk."
translation = "Stocke l'environnement Linux de Docker Desktop. Les données des applications Docker peuvent se trouver sur un disque distinct."

[messages.wsl-linux-cleanup-help]
source = "Browse the distribution’s files and remove data you no longer need. Use its Linux package manager to clean package caches. After cleanup, “sudo fstrim -av” inside the distribution may help release unused blocks before shutting down WSL and compacting."
translation = "Parcourez les fichiers de la distribution et supprimez les données devenues inutiles. Utilisez son gestionnaire de paquets Linux pour nettoyer les caches de paquets. Après le nettoyage, « sudo fstrim -av » dans la distribution peut aider à libérer les blocs inutilisés avant d'arrêter WSL et de compacter le disque."

[messages.wsl-linux-description]
source = "Stores this Linux distribution’s filesystem, including its programs and Linux-side files."
translation = "Stocke le système de fichiers de cette distribution Linux, y compris ses programmes et fichiers côté Linux."

