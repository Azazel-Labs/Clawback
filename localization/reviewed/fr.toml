source = "Before compacting, save your work, quit Docker Desktop and close WSL sessions. Run this command in PowerShell to stop all WSL distributions. Keep Docker and WSL stopped until compaction finishes. Windows will ask for administrator permission."
translation = "Avant le compactage, enregistrez votre travail, quittez Docker Desktop et fermez les sessions WSL. Exécutez cette commande dans PowerShell pour arrêter toutes les distributions WSL. Gardez Docker et WSL arrêtés jusqu'à la fin du compactage. Windows demandera une autorisation administrateur."

