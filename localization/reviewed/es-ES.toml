[messages.wsl-docker-cleanup-help]
source = "In Docker Desktop, review images, stopped containers and volumes. Build cache can also be cleaned with “docker builder prune”. Volumes may contain databases or other files you need; inspect them before removing them. Cleanup and disk compaction are separate steps."
translation = "En Docker Desktop, revisa las imágenes, los contenedores detenidos y los volúmenes. También puedes limpiar la caché de compilación con «docker builder prune». Los volúmenes pueden contener bases de datos u otros archivos necesarios; revísalos antes de eliminarlos. La limpieza y la compactación del disco son pasos distintos."

[messages.wsl-docker-data-description]
source = "Stores Docker images, containers, volumes and build cache."
translation = "Almacena imágenes, contenedores, volúmenes y la caché de compilación de Docker."

[messages.wsl-docker-system-description]
source = "Stores Docker Desktop’s Linux environment. Docker application data may be stored in a separate disk."
translation = "Almacena el entorno Linux de Docker Desktop. Los datos de las aplicaciones Docker pueden estar en un disco separado."

[messages.wsl-linux-cleanup-help]
source = "Browse the distribution’s files and remove data you no longer need. Use its Linux package manager to clean package caches. After cleanup, “sudo fstrim -av” inside the distribution may help release unused blocks before shutting down WSL and compacting."
translation = "Explora los archivos de la distribución y elimina los datos que ya no necesites. Usa su gestor de paquetes de Linux para limpiar las cachés de paquetes. Después de limpiar, ejecutar «sudo fstrim -av» dentro de la distribución puede ayudar a liberar bloques sin usar antes de apagar WSL y compactar."

[messages.wsl-linux-description]
source = "Stores this Linux distribution’s filesystem, including its programs and Linux-side files."
translation = "Almacena el sistema de archivos de esta distribución de Linux, incluidos sus programas y archivos del lado de Linux."

